[project]
name = "swaystatus"
version = "0.18.1"
description = "Generate a status line for swaybar"
readme = "README.md"
authors = [
    { name="Jeremy Cantrell", email="jmcantrell@gmail.com" }
]
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["sway", "wm", "status"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Desktop Environment",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "coverage>=7.17.5,<8.0.0",
    "ruff>=0.17.6,<0.18.0",
    "ty>=0.0.109,<0.0.110",
]

[project.urls]
"Homepage" = "https://sr.ht/~jmcantrell/swaystatus/"
"Repository" = "https://git.sr.ht/~jmcantrell/swaystatus"
"Bug Tracker" = "https://todo.sr.ht/~jmcantrell/swaystatus"

[project.scripts]
swaystatus = "swaystatus.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true
add-bounds = "major"

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.coverage.run]
source = ["src/"]
omit = ["src/*/__main__.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
